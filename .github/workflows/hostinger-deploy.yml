name: Hostinger Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: npm run build

      - name: Ensure PWA icons are in dist
        # Vite copies public/ into dist/ but explicitly copy icons to guarantee
        # they are always present for the PWA manifest and install prompt.
        run: |
          mkdir -p ./dist/icons
          cp -r ./public/icons/. ./dist/icons/
          echo "Icons in dist/icons:"
          ls -la ./dist/icons/

      - name: Verify Build Output
        run: |
          echo "=== dist/ root ==="
          ls -la ./dist/
          echo "=== Service Worker ==="
          ls -la ./dist/sw.js || echo "WARNING: sw.js not found!"
          echo "=== Manifest ==="
          ls -la ./dist/manifest.json || echo "WARNING: manifest.json not found!"

      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          security: loose
          server-dir: ./
          local-dir: ./dist/
          dangerous-clean-slate: true
